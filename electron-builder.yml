appId: com.modred522.dsh-manager
productName: DSH Manager
asar: false
# 打包后、发布前核对产物里被 require 的文件是否齐全（缺了就中止发布）。
afterPack: tools/after-pack.js
directories:
  output: release
files:
  - main.js
  - preload.js
  - lib/**
  - find-dsh.ps1
  - renderer/**
  - assets/whale.png
  - assets/app.ico
  - package.json
  - LICENSE
publish:
  provider: github
  owner: modred522
  repo: dsh-manager
  releaseType: release
win:
  icon: assets/app.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DSH Manager
  runAfterFinish: true
