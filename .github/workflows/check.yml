name: check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check (node --check)
        run: |
          node --check main.js
          node --check preload.js
          node --check lib/pure.js
          node --check lib/market.js
          node --check renderer/renderer.js
          node --check renderer/market.js

      - name: Unit tests (node:test)
        run: npm test

      # 漏列 files 白名单不会有构建报错，但装出来一启动就 Cannot find module（v1.0.5 事故）。
      - name: Packaging completeness (require vs electron-builder files)
        run: node tools/check-package.js
