name: check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check (node --check)
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer/renderer.js
          node --check renderer/market.js
