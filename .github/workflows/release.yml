name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set release metadata (version from tag)
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.Substring(1)
          npm pkg set version=$v
          npm pkg set author=modred522

      - name: Install dependencies
        run: npm install

      # 构建并发布：electron-builder 用 GH_TOKEN 上传 NSIS 安装器 + zip + latest.yml
      # 到 GitHub Release；若配置了 CSC_LINK/CSC_KEY_PASSWORD 则同时做代码签名。
      - name: Build, sign and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis zip --x64 --config electron-builder.yml --publish always
