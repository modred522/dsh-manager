<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
  <title>DSH 插件市场</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ================= 市场列表视图 ================= -->
  <div id="viewMarket" class="market-window">
    <header class="card market-win-head">
      <div class="header-left">
        <img class="logo" src="../assets/whale.png" alt="whale" />
        <div class="header-text">
          <h1>插件市场</h1>
          <p>npm / GitHub 双源搜索 · 详情 · 一键分析</p>
        </div>
      </div>
      <div class="market-src">
        <button id="srcNpm" class="btn btn-small src-active">npm</button>
        <button id="srcGithub" class="btn btn-small">GitHub</button>
      </div>
    </header>

    <!-- 搜索栏 -->
    <div class="install-row market-search-row">
      <input type="text" id="marketQuery" placeholder="搜索 dsh 插件（留空看热门）" spellcheck="false" />
      <button id="btnMarketSearch" class="btn btn-primary">搜索</button>
    </div>

    <!-- 结果列表 -->
    <div id="marketList" class="market-list"></div>

    <!-- 列表底部状态（加载更多 / 已全部加载） -->
    <div id="marketFooter" class="market-footer"></div>
  </div>

  <!-- ================= 插件详情视图（整页 + 可拖拽分栏） ================= -->
  <div id="viewDetail" class="market-window" hidden>
    <header class="card detail-head">
      <button id="btnBack" class="btn btn-small">← 返回市场</button>
      <h2 id="pluginTitle" class="detail-title">插件</h2>
      <div class="detail-actions">
        <button id="btnPluginInstall" class="btn btn-primary">安装</button>
        <button id="btnPluginAnalyze" class="btn">分析</button>
        <button id="btnPluginStop" class="btn btn-danger" hidden>停止分析</button>
      </div>
    </header>

    <div id="pluginBadges" class="plugin-badges"></div>
    <div id="pluginStats" class="plugin-stats"></div>

    <div id="detailSplit" class="detail-split">
      <!-- 左栏：README 原始数据 -->
      <div id="paneReadme" class="pane">
        <div class="pane-title">README（原始数据）</div>
        <div id="pluginReadme" class="pane-body"></div>
      </div>

      <!-- 竖分割条 -->
      <div id="splitV" class="splitter splitter-v" title="拖动调整宽度 · 双击复位"></div>

      <!-- 右栏：评分卡 + 控制台 -->
      <div id="paneAnalysis" class="pane">
        <div id="paneScore">
          <div class="pane-title">分析结果</div>
          <div id="analysisScore" class="pane-body"></div>
        </div>
        <div id="splitH" class="splitter splitter-h" title="拖动调整高度 · 双击复位"></div>
        <div id="paneLog">
          <div class="pane-title">分析控制台</div>
          <div id="analysisLog" class="pane-body"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div id="toasts" class="toasts"></div>

  <script src="market.js"></script>
</body>
</html>
